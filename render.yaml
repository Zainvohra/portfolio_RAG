services:
  - type: web
    name: portfolio-rag-backend
    env: python
    buildCommand: curl -LsSf https://astral.sh/uv/install.sh | sh && uv sync
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false

