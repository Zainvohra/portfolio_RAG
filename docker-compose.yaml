services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ai_bootcamp_container
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_bootcamp_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  mailhog:
    platform: linux/x86_64
    image: mailhog/mailhog
    networks:
      - bundle
    ports:
      - 1025:1025
      - 8025:8025
    restart: always

volumes:
  pgdata: