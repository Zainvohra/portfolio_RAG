services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ai_bootcamp_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER_BOOTCAMP}
      POSTGRES_PASSWORD: ${DB_PASSWORD_BOOTCAMP}
      POSTGRES_DB: ${DB_NAME_BOOTCAMP}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5431"   # host_port:container_port
    env_file:
      - .env 

  mailhog:
    platform: linux/x86_64
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025
    restart: always

volumes:
  pgdata: